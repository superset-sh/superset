name: Sync QStash Schedules

# The automation tick and the provider maintenance jobs are QStash schedules.
# This workflow makes the repo their source of truth: it creates any schedule
# whose destination has none, and leaves existing ones alone.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/sync-qstash-schedules.yml]

jobs:
  sync:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Create missing schedules
        env:
          QSTASH_TOKEN: ${{ secrets.QSTASH_TOKEN }}
          QSTASH_URL: ${{ secrets.QSTASH_URL }}
          API_URL: https://api.superset.sh
        run: |
          set -euo pipefail
          base="${QSTASH_URL:-https://qstash.upstash.io}"
          base="${base%/}"
          status=$(curl -s -o /tmp/schedules.json -w "%{http_code}" -H "Authorization: Bearer $QSTASH_TOKEN" "$base/v2/schedules")
          if [ "$status" != "200" ]; then
            echo "listing schedules failed: HTTP $status from $base"
            exit 1
          fi
          existing=$(cat /tmp/schedules.json)

          ensure() {
            local path="$1" cron="$2"
            local destination="$API_URL$path"
            if echo "$existing" | grep -qF "\"destination\":\"$destination\""; then
              echo "exists: $path"
              return
            fi
            curl -sf -X POST "$base/v2/schedules/$destination" \
              -H "Authorization: Bearer $QSTASH_TOKEN" \
              -H "Upstash-Cron: $cron" \
              -H "Content-Type: application/json" \
              -d '{}' > /dev/null
            echo "created: $path ($cron)"
          }

          # The tick: due schedules + the event-handoff sweep.
          ensure /api/automations/evaluate "* * * * *"
          # Google: calendar channels and the Gmail watch expire in 7 days.
          ensure /api/integrations/google/jobs/renew-watches "0 6 * * *"
          # Calendar starting-soon fires; interval is coupled to FIRE_HORIZON_MS.
          ensure /api/integrations/google/jobs/sweep-schedules "*/15 * * * *"
          # Teams Graph subscriptions expire in 2 days.
          ensure /api/integrations/microsoft-teams/jobs/renew-subscriptions "0 * * * *"
          # Linear tokens refresh within a 90-minute expiry window.
          ensure /api/integrations/linear/jobs/refresh-tokens "*/30 * * * *"
