name: Release Superedset

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metadata:
    if: vars.SUPEREDSET_RELEASES_ENABLED == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      build_time: ${{ steps.metadata.outputs.build_time }}
      short_sha: ${{ steps.metadata.outputs.short_sha }}
      version_timestamp: ${{ steps.metadata.outputs.version_timestamp }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - id: metadata
        run: |
          echo "build_time=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "version_timestamp=$(date -u +'%Y%m%d%H%M%S')" >> "$GITHUB_OUTPUT"

  build:
    needs: metadata
    uses: ./.github/workflows/build-desktop.yml
    with:
      channel: superedset
      version_suffix: "-superedset.${{ needs.metadata.outputs.version_timestamp }}"
      electron_builder_config: electron-builder.superedset.ts
      artifact_prefix: desktop-superedset
      artifact_retention_days: 14
    secrets: inherit

  release:
    needs: [metadata, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: release-artifacts
          pattern: desktop-superedset-*
          merge-multiple: true
      - uses: ./.github/actions/merge-mac-manifests
        with:
          artifact-prefix: desktop-superedset
          extra-manifest-names: superedset-mac.yml
      - name: Create Linux update manifests
        run: |
          cd release-artifacts
          for file in *-linux.yml; do
            if [[ -f "$file" && "$file" != "superedset-linux.yml" && "$file" != "latest-linux.yml" ]]; then
              cp "$file" superedset-linux.yml
              cp "$file" latest-linux.yml
              break
            fi
          done
      - name: Replace rolling release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete desktop-superedset --yes || true
          git push origin :refs/tags/desktop-superedset || true
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: desktop-superedset
          name: Superedset
          body: |
            Personal Superset build containing current upstream plus open pull requests.

            - Commit: ${{ github.sha }}
            - Short SHA: ${{ needs.metadata.outputs.short_sha }}
            - Built: ${{ needs.metadata.outputs.build_time }}
          prerelease: true
          files: release-artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
