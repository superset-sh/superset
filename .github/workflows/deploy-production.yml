            --env BLAXEL_WORKSPACE=$BLAXEL_WORKSPACE \
            --env BLAXEL_REGION=$BLAXEL_REGION \
            --env SENTRY_DSN_SANDBOX=$SENTRY_DSN_SANDBOX \
            --env OPENAI_API_KEY=$OPENAI_API_KEY \
