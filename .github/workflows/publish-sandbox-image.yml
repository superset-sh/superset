name: Publish sandbox image

# Builds and publishes the default Superset workspace sandbox image to GHCR.
# host-service defaults non-development workspaces to
# ghcr.io/superset-sh/sandbox:latest, so this must run before that default is
# reachable in a release. Multi-arch (amd64 + arm64) so both host CPUs work.

on:
  push:
    branches: [main]
    paths:
      - "packages/sandbox-image/**"
      - ".github/workflows/publish-sandbox-image.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish (default: latest)"
        required: false
        type: string
        default: latest

concurrency:
  group: publish-sandbox-image
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_TAG: ${{ inputs.tag || 'latest' }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: packages/sandbox-image
          file: packages/sandbox-image/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/superset-sh/sandbox:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
# NOTE: the GHCR package must be made PUBLIC once (Packages → sandbox →
# Package settings → Change visibility) so hosts can `docker pull` the default
# ghcr.io/superset-sh/sandbox:latest without a login. Until then, non-dev
# provisioning fails with "denied"; dev hosts use the local superset-sandbox:dev.
