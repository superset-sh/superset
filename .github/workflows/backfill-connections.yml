name: Backfill Connections

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Write the rows. Leave unchecked for a dry run that only reports.
        type: boolean
        default: false

jobs:
  backfill:
    name: Backfill Connections
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: backfill-connections
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Bun
        id: setup-bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Cache dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ steps.setup-bun.outputs.bun-revision }}-${{ hashFiles('bun.lock') }}

      - name: Install dependencies
        run: bun install --frozen --ignore-scripts

      - name: Backfill connections
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
          # Must be the key the API decrypts with, which is why this runs here.
          SECRETS_ENCRYPTION_KEY: ${{ secrets.SECRETS_ENCRYPTION_KEY }}
          APPLY: ${{ inputs.apply }}
        run: |
          if [ "$APPLY" = "true" ]; then
            bun run packages/trpc/scripts/backfill-connections.ts --apply
          else
            bun run packages/trpc/scripts/backfill-connections.ts
          fi
