        run: |
          vercel pull --yes --environment=preview --token=$VERCEL_TOKEN
          vercel build --token=$VERCEL_TOKEN
          VERCEL_URL=$(vercel deploy --prebuilt --archive=tgz --token=$VERCEL_TOKEN \
            --env DATABASE_URL=$DATABASE_URL \
            --env DATABASE_URL_UNPOOLED=$DATABASE_URL_UNPOOLED \
            --env BETTER_AUTH_SECRET=$BETTER_AUTH_SECRET \
            --env NEXT_PUBLIC_API_URL=$NEXT_PUBLIC_API_URL \
            --env NEXT_PUBLIC_WEB_URL=$NEXT_PUBLIC_WEB_URL \
            --env NEXT_PUBLIC_MARKETING_URL=$NEXT_PUBLIC_MARKETING_URL \
            --env NEXT_PUBLIC_ADMIN_URL=$NEXT_PUBLIC_ADMIN_URL \
            --env NEXT_PUBLIC_COOKIE_DOMAIN=$NEXT_PUBLIC_COOKIE_DOMAIN \
            --env NEXT_PUBLIC_POSTHOG_KEY=$NEXT_PUBLIC_POSTHOG_KEY \
            --env NEXT_PUBLIC_POSTHOG_HOST=$NEXT_PUBLIC_POSTHOG_HOST \
            --env NEXT_PUBLIC_SENTRY_DSN_MARKETING=$NEXT_PUBLIC_SENTRY_DSN_MARKETING \
            --env NEXT_PUBLIC_SENTRY_ENVIRONMENT=$NEXT_PUBLIC_SENTRY_ENVIRONMENT \
            --env KV_REST_API_URL=$KV_REST_API_URL \
            --env KV_REST_API_TOKEN=$KV_REST_API_TOKEN \
            --env KV_URL=$KV_URL \
            --env RESEND_API_KEY=$RESEND_API_KEY \
            --env STRIPE_SECRET_KEY=$STRIPE_SECRET_KEY \
            --env STRIPE_WEBHOOK_SECRET=$STRIPE_WEBHOOK_SECRET \
            --env STRIPE_PRO_MONTHLY_PRICE_ID=$STRIPE_PRO_MONTHLY_PRICE_ID \
            --env STRIPE_PRO_YEARLY_PRICE_ID=$STRIPE_PRO_YEARLY_PRICE_ID \
            --env STRIPE_ENTERPRISE_YEARLY_PRICE_ID=$STRIPE_ENTERPRISE_YEARLY_PRICE_ID \
            --env SLACK_BILLING_WEBHOOK_URL=$SLACK_BILLING_WEBHOOK_URL \
            --env SECRETS_ENCRYPTION_KEY=$SECRETS_ENCRYPTION_KEY \
            --env ANTHROPIC_API_KEY=$ANTHROPIC_API_KEY)
          vercel alias $VERCEL_URL ${{ env.MARKETING_ALIAS }} --scope=$VERCEL_ORG_ID --token=$VERCEL_TOKEN
          echo "vercel_url=$VERCEL_URL" >> $GITHUB_OUTPUT

      # Until now the pipeline deployed and never requested a page, so a build
      # that returned 500 on every route still went green. MARKETING-67/68/69
      # reached production that way.
      - name: Smoke test marketing routes
        run: |
          bun scripts/smoke-routes.ts "https://${{ env.MARKETING_ALIAS }}" --localized \
            / /pricing /enterprise /download /join-us /community /contact \
            /blog /changelog /compare /roadmap /leaderboard /marketplace \
            /agent-orchestration /parallel-coding-agents /factory-2026 \
            /mcp-install /stats /team /starchart /the-production-run

      # Non-page endpoints, checked without --localized because they serve
      # markdown and text rather than an <html> document. These are the paths
      # src/proxy.ts must NOT rewrite into the [lang] tree: the matcher there
      # swallowed /ingest and /monitoring for four days in 2026-08 and nothing
      # noticed, because the pages above all kept returning 200.
      - name: Smoke test marketing non-page endpoints
        run: |
          bun scripts/smoke-routes.ts "https://${{ env.MARKETING_ALIAS }}" \
            /md/page/pricing /ja/md/page/pricing /llms.txt /agents.md \
            /index.md /robots.txt /sitemap.xml /.well-known/mcp

      - name: Save marketing success status
        run: |
          cat > marketing-status.env << EOF
          MARKETING_STATUS="✅"
          MARKETING_LINK="<a href=\"https://${{ env.MARKETING_ALIAS }}\">Open Preview</a>"
          EOF

      - name: Upload marketing status
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: marketing-status
          path: marketing-status.env

