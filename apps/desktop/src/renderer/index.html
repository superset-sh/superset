<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Theme boot script must run before body to prevent flash -->
    <script type="module" src="/theme-boot.js"></script>
    <!--
      Content Security Policy
      https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP

      - default-src 'self': Only allow resources from same origin
      - script-src 'self' 'wasm-unsafe-eval' https://*.posthog.com: Allow scripts from same origin + WebAssembly (for xterm ImageAddon) + PostHog
      - style-src 'self' 'unsafe-inline': Allow styles from same origin + inline (needed for CSS-in-JS)
      - connect-src 'self' data: blob: ws: wss: http://127.0.0.1:* %RELAY_URL% https://relay-backup.superset.sh https://relay2.superset.sh https://superset-relay2.avi-6ac.workers.dev %NEXT_PUBLIC_API_URL% https://*.posthog.com https://*.sentry.io sentry-ipc: https://*.preview.bl.run https://*.public.blob.vercel-storage.com: Allow WebSocket + API + PostHog + Sentry + data URIs (file attachment upload via data URL) + blob URIs + local host-service (127.0.0.1) + relay + relay override target (for staging/failover via PostHog flag) + cloud workspace sandboxes, which a browser reaches directly at the provider's preview domain (this entry goes away once that traffic moves behind the relay) + published page content, which the page pane fetches straight from blob storage (this entry goes away when pages move to a user-content origin we serve ourselves)
      - img-src 'self' data: blob: https: http:: Allow images from any source (needed for favicons, browser pane webview content, and file attachment previews)
      - media-src 'self' data: blob:: Allow <video>/<audio> from blob + data URIs (file preview); without this, media falls back to default-src 'self' and blob video won't play
      - font-src 'self': Allow fonts from same origin
      - frame-src https: http: data: blob: superset-page:: Allow webview browser pane to load any URL + the page pane's frame, which main serves under the page's own CSP (srcdoc would inherit this policy and block the page's scripts)
      - child-src 'self' blob:: Allow workers from same origin + blob workers
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://*.posthog.com; style-src 'self' 'unsafe-inline'; connect-src 'self' data: blob: ws: wss: http://127.0.0.1:* %RELAY_URL% https://relay-backup.superset.sh https://relay2.superset.sh https://superset-relay2.avi-6ac.workers.dev %NEXT_PUBLIC_API_URL% https://*.posthog.com https://*.sentry.io sentry-ipc: https://*.preview.bl.run https://*.public.blob.vercel-storage.com; img-src 'self' data: blob: https: http:; media-src 'self' data: blob:; font-src 'self'; frame-src https: http: data: blob: superset-page:; child-src 'self' blob:;" />
  </head>

  <body>
    <app></app>
    <script type="module" src="index.tsx"></script>
  </body>
</html>
