<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html,body{margin:0;background:#0a0a0a}
  body{width:1200px;height:630px;overflow:hidden;position:relative;font-family:"Inter Variable",Inter,ui-sans-serif,system-ui,sans-serif;font-feature-settings:"cv01","ss03";color:#fff;-webkit-font-smoothing:antialiased}
  .glow{position:absolute;left:50%;top:100%;width:1600px;height:900px;transform:translate(-50%,-52%);background:radial-gradient(closest-side,rgba(210,86,17,.5),rgba(210,86,17,.14) 45%,rgba(10,10,10,0) 72%);pointer-events:none}
  .top{position:absolute;left:0;right:0;top:52px;display:flex;flex-direction:column;align-items:center;gap:30px}
  h1{margin:0;font-size:68px;font-weight:500;letter-spacing:-0.035em;line-height:1.15;word-spacing:.15em;color:#fafafa;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
  h1 .br{display:inline-block;padding:.06em .2em;background-image:linear-gradient(#d25611,#d25611),linear-gradient(#d25611,#d25611),linear-gradient(#d25611,#d25611),linear-gradient(#d25611,#d25611),linear-gradient(#d25611,#d25611),linear-gradient(#d25611,#d25611),linear-gradient(#d25611,#d25611),linear-gradient(#d25611,#d25611);background-repeat:no-repeat;background-size:.15em 4px,4px .15em,.15em 4px,4px .15em,.15em 4px,4px .15em,.15em 4px,4px .15em;background-position:0 0,0 0,100% 0,100% 0,0 100%,0 100%,100% 100%,100% 100%}
  .win{position:absolute;left:50%;top:372px;transform:translateX(-50%);width:1060px;height:420px;border-radius:12px;background:#0f0f0f;border:1px solid rgba(255,255,255,.16);box-shadow:0 0 0 1px rgba(0,0,0,.6),0 40px 120px rgba(0,0,0,.6);overflow:hidden}
  .win img{display:block;width:100%;height:auto}
  .fade{position:absolute;left:0;right:0;bottom:0;height:150px;background:linear-gradient(180deg,rgba(10,10,10,0),rgba(10,10,10,.92) 70%,#0a0a0a)}
</style></head><body>
<div class="glow"></div>
<div class="top">
  <img src="../../public/title.svg" style="height:78px">
  <h1><span>Bring Any Agent.</span><span class="br">Orchestrate Them All.</span></h1>
</div>
<div class="win"><img src="screenshot.png"></div>
<div class="fade"></div>
</body></html>
