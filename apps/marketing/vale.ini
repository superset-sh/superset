; Prose linting for marketing content. House rules live in
; docs/copywriting-references.md; the Superset style encodes the lintable ones.
; Run: bun run lint:prose (or `vale content` from apps/marketing).
StylesPath = vale-styles
MinAlertLevel = suggestion
; Third-party packages are vendored into vale-styles by `vale sync` and
; committed, so CI needs no network fetch.
Packages = MDX, proselint, write-good, alex

[formats]
mdx = md

[*.{md,mdx}]
BasedOnStyles = Superset, proselint, write-good, alex

; --- Third-party calibration (baselined 2026-08-17 over all 119 content files).
; Only Superset house rules may be error-level; third-party packages are
; advisory (suggestion) so style opinions never fail CI.

; Off: junk or conflicts with the house voice.
write-good.E-Prime = NO        ; E-Prime (bans all "to be"); 2500+ hits, useless
write-good.So = NO             ; casual "So..." openers are Kiet's voice
proselint.But = NO             ; PG-style "But" openers are house voice
proselint.Typography = NO      ; straight quotes/"..." are deliberate in MDX
proselint.Annotations = NO     ; changelog SOP mandates TODO placeholders
alex.ProfanityUnlikely = NO    ; flags "execute", "failed", etc.
alex.Condescending = NO        ; flags "simple/easy/just", core marketing vocab
alex.Race = NO                 ; flags "primitive" in the technical sense

; Advisory: real signal, human judgment required.
write-good.TooWordy = suggestion
write-good.Passive = suggestion
write-good.Weasel = suggestion
write-good.ThereIs = suggestion
write-good.Cliches = suggestion
proselint.Very = suggestion
proselint.Cliches = suggestion
proselint.Uncomparables = suggestion
proselint.Needless = suggestion
proselint.Diacritical = suggestion
alex.Ablist = suggestion       ; sampled hits were "mental model", "disabled" (UI)
alex.ProfanityMaybe = suggestion
alex.ProfanityLikely = suggestion

[content/changelog/*.mdx]
BasedOnStyles = Superset, SupersetChangelog, proselint, write-good, alex
